appId: com.aryanpxcr7.npmservermanager
productName: NPM Server Manager
copyright: Copyright © 2026 aryanpxcr7

directories:
  buildResources: build
  output: release

files:
  - out/**/*
  - package.json

asar: true

win:
  target:
    - target: nsis
      arch: [x64]
  artifactName: ${productName}-${version}-Setup.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: NPM Server Manager

publish: null
