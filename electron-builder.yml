appId: com.aryanpxcr7.npmservermanager
productName: NPM Server Manager
copyright: Copyright © 2026 aryanpxcr7

directories:
  buildResources: build
  output: release

files:
  - out/**/*
  - package.json

# The tray and window icons are read at runtime, so they ship as resources.
extraResources:
  - from: build/tray.png
    to: tray.png
  - from: build/icon.png
    to: icon.png

asar: true

# node-pty is a native module: its .node files and the sibling package holding
# them have to sit on disk as real files, because `require` cannot load a binary
# from inside the asar archive.
asarUnpack:
  - "**/node_modules/@lydell/**"

win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64]
  artifactName: ${productName}-${version}-Setup.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: NPM Server Manager

publish: null
